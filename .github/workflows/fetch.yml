name: Fetch

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-all:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Fetch all M3U8 URLs
        run: |
          python3 - << 'PY'
          import requests
          from bs4 import BeautifulSoup
          from urllib.parse import urljoin

          # Base URL situsmu
          base_url = "https://stream.livenobarseru.com/"

          # Ambil halaman utama / index
          r = requests.get(base_url)
          r.raise_for_status()
          soup = BeautifulSoup(r.text, 'html.parser')

          # Cari semua link ke match
          match_links = set()
          for a in soup.find_all('a', href=True):
              href = a['href']
              if '/match/' in href:
                  full_url = urljoin(base_url, href)
                  match_links.add(full_url)

          print(f"Found {len(match_links)} match pages")

          # Ambil semua M3U8 dari tiap halaman match
          m3u8_urls = set()
          for link in match_links:
              try:
                  r = requests.get(link)
                  r.raise_for_status()
                  soup = BeautifulSoup(r.text, 'html.parser')

                  for source in soup.find_all('source'):
                      src = source.get('src', '')
                      if '.m3u8' in src:
                          m3u8_urls.add(src)

                  for video in soup.find_all('video'):
                      src = video.get('src', '')
                      if '.m3u8' in src:
                          m3u8_urls.add(src)
              except Exception as e:
                  print(f"Failed to fetch {link}: {e}")

          # Simpan semua URL ke file
          with open('1780301056.txt', 'w') as f:
              for url in sorted(m3u8_urls):
                  f.write(url + '\n')

          print(f"Saved {len(m3u8_urls)} M3U8 URLs to 1780301056.txt")
          PY

      - name: Commit file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 1780301056.txt
          git diff --cached --quiet && exit 0
          git commit -m "Update 1780301056.txt with all M3U8 URLs"
          git push
