name: Fetch

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  save-source:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Fetch page source
        run: |
          # gunakan Python requests untuk meniru browser
          python3 - << 'PY'
          import requests
          url = "https://aspaltvpasti.top/xxx/merah.php"
          headers = {"User-Agent": "Mozilla/5.0"}
          r = requests.get(url, headers=headers)
          r.raise_for_status()
          with open("1780301056.txt", "w", encoding="utf-8") as f:
              f.write(r.text)
          PY

      - name: Commit file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 1780301056.txt
          git diff --cached --quiet && exit 0
          git commit -m "Update 1780301056.txt"
          git push
